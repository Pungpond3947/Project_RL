seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 1000
empirical_normalization: true
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
  noise_std_type: scalar
  actor_hidden_dims:
  - 128
  - 128
  critic_hidden_dims:
  - 128
  - 128
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.001
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0005
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  symmetry_cfg: null
  rnd_cfg: null
clip_actions: 1.0
save_interval: 100
experiment_name: one_leg_uan_deploy
run_name: exp1_H40
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
